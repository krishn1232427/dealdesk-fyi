name: Apply homepage deal lifecycle fix

on:
  push:
    branches:
      - agent/fix-homepage-deal-count

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-homepage-deal-count
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch homepage lifecycle
        run: node scripts/fix-homepage-deal-lifecycle-20260807.mjs

      - name: Rebuild generated catalog
        run: node scripts/build-seo.mjs

      - name: Validate affiliate catalog
        run: node scripts/validate-deals.mjs

      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix homepage deal lifecycle"
          git push origin HEAD:agent/fix-homepage-deal-count
