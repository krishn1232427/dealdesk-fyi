name: Publish committed DealDesk site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v4

      - name: Verify committed SEO release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f sitemap-authority.xml
          test -f feed.xml
          test -f llms.txt
          grep -q 'name="dealdesk-build" content="2026-08-08-crawl-v3"' index.html
          grep -q 'name="dealdesk-seo" content="2026-08-08-authority-v1"' index.html
          grep -q '<sitemapindex' sitemap.xml
          grep -q 'Sitemap: https://dealdesk.fyi/sitemap.xml' robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload committed static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
