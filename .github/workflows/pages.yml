name: Audit committed DealDesk SEO release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v4

      - name: Verify committed SEO release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f sitemap-authority.xml
          test -f feed.xml
          test -f llms.txt
          grep -q 'name="dealdesk-build" content="2026-08-08-crawl-v3"' index.html
          grep -q 'name="dealdesk-seo" content="2026-08-08-authority-v1"' index.html
          grep -q '<sitemapindex' sitemap.xml
          grep -q 'Sitemap: https://dealdesk.fyi/sitemap.xml' robots.txt
