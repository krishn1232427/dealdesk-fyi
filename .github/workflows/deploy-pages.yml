name: Deploy DealDesk to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      refresh_ebay:
        description: Capture and refresh existing eBay items before the build
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set one release timestamp
        shell: bash
        run: echo "DEALDESK_BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install final indexing sources when present
        shell: bash
        run: |
          if [[ -f scripts/install-final-indexing-v3.mjs ]]; then
            node scripts/install-final-indexing-v3.mjs
          fi

      - name: Install final SEO authority sources when present
        shell: bash
        run: |
          if [[ -f scripts/install-seo-authority.mjs ]]; then
            node scripts/install-seo-authority.mjs
          fi

      - name: Install content-integrity safeguards when present
        shell: bash
        run: |
          if [[ -f scripts/install-content-integrity.mjs ]]; then
            node scripts/install-content-integrity.mjs
          fi

      - name: Check build scripts
        run: |
          node --check scripts/build-seo.mjs
          node --check scripts/lib/search-index-policy.mjs
          node --check scripts/validate-deals.mjs
          node --check scripts/build-indexing-hubs.mjs
          node --check scripts/validate-indexing.mjs
          node --check scripts/build-seo-authority.mjs
          node --check scripts/validate-seo-authority.mjs
          node --check scripts/build-search-discovery.mjs
          node --check scripts/validate-search-discovery.mjs
          node --check scripts/build-image-sitemap.mjs
          node --check scripts/validate-image-sitemap.mjs
          node --check scripts/build-price-history.mjs
          node --check scripts/validate-price-history.mjs
          node --check scripts/validate-content-integrity.mjs
          node --check scripts/submit-indexnow.mjs
          node --check scripts/import-ebay-events.mjs
          node --check scripts/import-ebay-products.mjs
          node --check scripts/capture-ebay-promotion-products.mjs
          node --check scripts/prune-stale-deals.mjs

      - name: Refresh currently listed eBay products from live promotion grids
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_ebay
        shell: bash
        run: |
          capture_file="data/ebay-products-$(date -u +%Y-%m-%dT%H%M%SZ).json"
          if node scripts/capture-ebay-promotion-products.mjs data/ebay-events-2026-08-01.json "$capture_file" \
            && node scripts/import-ebay-products.mjs "$capture_file" data/ebay-events-2026-08-01.json --existing-only; then
            echo "Refreshed exact eBay items with immutable evidence: $capture_file"
          else
            rm -f "$capture_file"
            echo "eBay refresh was skipped; the prior catalog and evidence remain unchanged."
          fi

      - name: Rebuild current DealDesk release
        run: node scripts/build-seo.mjs

      - name: Validate deal and outbound rules
        run: node scripts/validate-deals.mjs

      - name: Build static crawl architecture
        run: node scripts/build-indexing-hubs.mjs

      - name: Validate indexing architecture
        run: node scripts/validate-indexing.mjs

      - name: Build SEO authority engine
        run: node scripts/build-seo-authority.mjs

      - name: Validate SEO authority engine
        run: node scripts/validate-seo-authority.mjs

      - name: Build multi-engine discovery assets
        run: node scripts/build-search-discovery.mjs

      - name: Validate multi-engine discovery assets
        run: node scripts/validate-search-discovery.mjs

      - name: Build Google Images sitemap
        run: node scripts/build-image-sitemap.mjs

      - name: Validate Google Images sitemap
        run: node scripts/validate-image-sitemap.mjs

      - name: Build first-party price history
        run: node scripts/build-price-history.mjs

      - name: Validate first-party price history
        run: node scripts/validate-price-history.mjs

      - name: Validate comparison and history integrity
        run: node scripts/validate-content-integrity.mjs

      - name: Validate final generated release
        run: |
          node scripts/validate-deals.mjs
          node scripts/validate-indexing.mjs
          node scripts/validate-seo-authority.mjs
          node scripts/validate-search-discovery.mjs
          node scripts/validate-image-sitemap.mjs
          node scripts/validate-price-history.mjs
          node scripts/validate-content-integrity.mjs

      - name: Commit finalized DealDesk release to master
        id: release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize DealDesk SEO, image discovery, and price history release"
            git push origin HEAD:master
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Bing and IndexNow participants
        id: indexnow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

      - name: Record deployment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_COMMIT: ${{ steps.release.outputs.commit }}
          INDEXNOW_STATUS: ${{ steps.indexnow.outcome }}
        run: |
          git fetch origin deployment-status
          git worktree add /tmp/dealdesk-deployment-status origin/deployment-status
          cd /tmp/dealdesk-deployment-status
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "status": os.environ.get("JOB_STATUS", "unknown"),
              "deployedCommit": os.environ.get("DEPLOYED_COMMIT") or os.environ.get("GITHUB_SHA", ""),
              "pageUrl": os.environ.get("PAGE_URL", ""),
              "indexNowStatus": os.environ.get("INDEXNOW_STATUS", "unknown"),
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "recordedAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("deploy-status.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status.json
          git commit -m "Record DealDesk Pages deployment result" || true
          git push origin HEAD:deployment-status
