name: Deploy DealDesk to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check indexing scripts
        run: |
          node --check scripts/build-indexing-hubs.mjs
          node --check scripts/validate-indexing.mjs

      - name: Rebuild current DealDesk release
        run: node scripts/build-seo.mjs

      - name: Validate deal and outbound rules
        run: node scripts/validate-deals.mjs

      - name: Build static crawl architecture
        run: node scripts/build-indexing-hubs.mjs

      - name: Validate indexing architecture
        run: node scripts/validate-indexing.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git fetch origin deployment-status
          git worktree add /tmp/dealdesk-deployment-status origin/deployment-status
          cd /tmp/dealdesk-deployment-status
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "status": os.environ.get("JOB_STATUS", "unknown"),
              "deployedCommit": os.environ.get("GITHUB_SHA", ""),
              "pageUrl": os.environ.get("PAGE_URL", ""),
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "recordedAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("deploy-status.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status.json
          git commit -m "Record DealDesk Pages deployment result" || true
          git push origin HEAD:deployment-status
