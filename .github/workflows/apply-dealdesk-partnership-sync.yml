name: Apply DealDesk partnership sync

on:
  push:
    branches:
      - agent/restore-deals-and-record-partnerships

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply lifecycle and partnership migration
        run: node scripts/sync-approved-partnerships-20260807.mjs

      - name: Rebuild generated DealDesk catalog
        run: node scripts/build-seo.mjs

      - name: Validate affiliate catalog
        run: node scripts/validate-deals.mjs

      - name: Commit rebuilt catalog
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Migration produced no changes."
            exit 0
          fi
          git config user.name "DealDesk Automation"
          git config user.email "hello.launchdesk@gmail.com"
          git add -A
          git commit -m "Restore deal inventory and record new partnerships [skip migration]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
