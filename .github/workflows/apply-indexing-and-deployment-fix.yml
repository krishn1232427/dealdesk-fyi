name: Apply DealDesk indexing and deployment fix

on:
  push:
    branches:
      - agent/indexing-and-deployment-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/indexing-and-deployment-fix
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check migration syntax
        run: node --check scripts/apply-indexing-and-deployment-fix-20260808.mjs

      - name: Apply source changes
        run: node scripts/apply-indexing-and-deployment-fix-20260808.mjs

      - name: Rebuild generated site
        run: node scripts/build-seo.mjs

      - name: Validate catalog and SEO lifecycle
        run: node scripts/validate-deals.mjs

      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Fix DealDesk deployment and indexing signals"
            git push origin HEAD:agent/indexing-and-deployment-fix
          fi
