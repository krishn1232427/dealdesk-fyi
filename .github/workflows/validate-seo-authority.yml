name: Validate DealDesk SEO authority release

on:
  push:
    branches:
      - agent/seo-authority-engine-final
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final authority branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-authority-engine-final

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check build scripts
        run: |
          node --check scripts/build-seo-authority.mjs
          node --check scripts/validate-seo-authority.mjs
          node --check scripts/build-indexing-hubs.mjs
          node --check scripts/validate-indexing.mjs

      - name: Rebuild and validate base deal release
        run: |
          node scripts/build-seo.mjs
          node scripts/validate-deals.mjs

      - name: Rebuild and validate crawl architecture
        run: |
          node scripts/build-indexing-hubs.mjs
          node scripts/validate-indexing.mjs

      - name: Rebuild and validate SEO authority engine
        run: |
          node scripts/build-seo-authority.mjs
          node scripts/validate-seo-authority.mjs
