<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening Merchant | DealDesk</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell narrow-shell">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="/">DealDesk</a>
        <div class="links">
          <a href="/support/">Support</a>
          <a href="/privacy/">Privacy</a>
        </div>
      </nav>

      <section class="section">
        <p class="eyebrow">Affiliate Disclosure</p>
        <h1 class="compact-title">Opening merchant site.</h1>
        <p id="status">
          DealDesk may earn a commission from some purchases. The merchant cart remains
          the source of truth for final price, taxes, shipping, availability, and return terms.
        </p>
        <p id="fallback" hidden>
          <a class="button" id="merchant-link" href="/">Continue to merchant</a>
        </p>
      </section>
    </main>

    <script>
      (function () {
        var approvedAmazonTrackingID = "dealdesk-20";
        var approvedDestinations = {
          "https://www.kqzyfj.com/click-101847838-13756265": "cj",
          "https://www.tkqlhce.com/click-101847838-15438560": "cj",
          "https://www.kqzyfj.com/click-101847838-15642853": "cj",
          "https://www.hotels.com/affiliate/2B7dO8R": "expedia-group-direct"
        };
        var params = new URLSearchParams(window.location.search);
        var rawURL = params.get("url");
        var subID = cleanSubID(params.get("subid")) || "dealdesksite";
        var network = (params.get("network") || "").toLowerCase();
        var status = document.getElementById("status");
        var fallback = document.getElementById("fallback");
        var merchantLink = document.getElementById("merchant-link");

        function fail(message) {
          status.textContent = message;
          fallback.hidden = true;
        }

        if (!rawURL) {
          fail("No merchant URL was provided.");
          return;
        }

        var destination;
        try {
          destination = new URL(rawURL);
        } catch (error) {
          fail("The merchant URL is not valid.");
          return;
        }

        if (destination.protocol !== "http:" && destination.protocol !== "https:") {
          fail("DealDesk can only open web merchant URLs.");
          return;
        }

        var affiliateURL = buildAffiliateURL(destination, network, subID);
        if (!affiliateURL) {
          return;
        }

        merchantLink.href = affiliateURL.href;
        fallback.hidden = false;
        window.setTimeout(function () {
          window.location.replace(affiliateURL.href);
        }, 350);

        function buildAffiliateURL(destinationURL, affiliateNetwork, clickRef) {
          if (affiliateNetwork === "amazon-associates") {
            var hostname = destinationURL.hostname.toLowerCase();
            var isAmazon = hostname === "amazon.com" || hostname === "www.amazon.com";
            if (!isAmazon || destinationURL.searchParams.get("tag") !== approvedAmazonTrackingID) {
              fail("This Amazon link is missing DealDesk's approved commission tracking ID.");
              return null;
            }
            return destinationURL;
          }

          var canonical = destinationURL.origin + destinationURL.pathname;
          if (approvedDestinations[canonical] === affiliateNetwork) {
            if (affiliateNetwork === "cj") destinationURL.searchParams.set("sid", clickRef);
            return destinationURL;
          }

          fail("This merchant does not yet have an approved DealDesk commission path.");
          return null;
        }

        function cleanSubID(value) {
          if (!value) return "";
          return value.replace(/[^a-zA-Z0-9]/g, "").slice(0, 32);
        }

      })();
    </script>
  </body>
</html>
