<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening Merchant | DealDesk</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell narrow-shell">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="/">DealDesk</a>
        <div class="links">
          <a href="/support/">Support</a>
          <a href="/privacy/">Privacy</a>
        </div>
      </nav>

      <section class="section">
        <p class="eyebrow">Affiliate Disclosure</p>
        <h1 class="compact-title">Opening merchant site.</h1>
        <p id="status">
          DealDesk may earn a commission from some purchases. The merchant cart remains
          the source of truth for final price, taxes, shipping, availability, and return terms.
        </p>
        <p id="fallback" hidden>
          <a class="button" id="merchant-link" href="/">Continue to merchant</a>
        </p>
      </section>
    </main>

    <script>
      (async function () {
        var approvedAmazonTrackingID = "dealdesk-20";
        var approvedEbayTracking = {
          mkcid: "1",
          mkrid: "711-53200-19255-0",
          siteid: "0",
          campid: "5339181076",
          toolid: "20014",
          customid: "",
          mkevt: "1"
        };
        var approvedRakutenTracking = {
          id: "JyyDRUQnGvw",
          offerid: "2061576.5023433051046838324",
          type: "2",
          murl: "https://sensibo.com/products/sensibo-air-bundle?variant=33051046838324"
        };
        var approvedDestinations = {
          "https://www.kqzyfj.com/click-101847838-13756265": "cj",
          "https://www.tkqlhce.com/click-101847838-15438560": "cj",
          "https://www.kqzyfj.com/click-101847838-15642853": "cj",
          "https://www.tkqlhce.com/click-101847838-17217038": "cj",
          "https://www.hotels.com/affiliate/2B7dO8R": "expedia-group-direct"
        };
        var params = new URLSearchParams(window.location.search);
        var rawURL = params.get("url");
        var requestedValidUntil = params.get("until");
        var subID = cleanSubID(params.get("subid")) || "dealdesksite";
        var network = (params.get("network") || "").toLowerCase();
        var status = document.getElementById("status");
        var fallback = document.getElementById("fallback");
        var merchantLink = document.getElementById("merchant-link");

        function fail(message) {
          status.textContent = message;
          fallback.hidden = true;
        }

        if (!rawURL) {
          fail("No merchant URL was provided.");
          return;
        }

        var approval;
        try {
          var approvalResponse = await fetch("/data/outbound-approvals.json", {
            cache: "no-store",
            credentials: "same-origin"
          });
          if (!approvalResponse.ok) throw new Error("approval catalog unavailable");
          var approvalCatalog = await approvalResponse.json();
          approval = (approvalCatalog.deals || []).find(function (deal) {
            return deal.network === network &&
              deal.affiliateURL === rawURL &&
              deal.validUntil === requestedValidUntil;
          });
        } catch (error) {
          fail("DealDesk could not verify this offer. Please return to Latest deals.");
          return;
        }

        var validUntil = approval ? Date.parse(approval.validUntil) : NaN;
        if (!approval || !Number.isFinite(validUntil) || Date.now() > validUntil) {
          fail("This offer is no longer within DealDesk's verified availability window.");
          return;
        }

        var destination;
        try {
          destination = new URL(rawURL);
        } catch (error) {
          fail("The merchant URL is not valid.");
          return;
        }

        if (destination.protocol !== "http:" && destination.protocol !== "https:") {
          fail("DealDesk can only open web merchant URLs.");
          return;
        }

        var affiliateURL = buildAffiliateURL(destination, network, subID);
        if (!affiliateURL) {
          return;
        }

        merchantLink.href = affiliateURL.href;
        fallback.hidden = false;
        window.setTimeout(function () {
          window.location.replace(affiliateURL.href);
        }, 350);

        function buildAffiliateURL(destinationURL, affiliateNetwork, clickRef) {
          if (affiliateNetwork === "amazon-associates") {
            var hostname = destinationURL.hostname.toLowerCase();
            var isAmazon = hostname === "amazon.com" || hostname === "www.amazon.com";
            if (!isAmazon || destinationURL.searchParams.get("tag") !== approvedAmazonTrackingID) {
              fail("This Amazon link is missing DealDesk's approved commission tracking ID.");
              return null;
            }
            return destinationURL;
          }

          if (affiliateNetwork === "ebay-partner-network") {
            var isEbay = destinationURL.hostname.toLowerCase() === "www.ebay.com";
            var hasApprovedTracking = isEbay && Object.keys(approvedEbayTracking).every(function (key) {
              return destinationURL.searchParams.get(key) === approvedEbayTracking[key];
            });
            if (!hasApprovedTracking) {
              fail("This eBay link is missing DealDesk's approved EPN campaign tracking.");
              return null;
            }
            return destinationURL;
          }

          if (affiliateNetwork === "rakuten-advertising") {
            var rakutenParameters = Array.from(destinationURL.searchParams.entries());
            var isRakuten = destinationURL.origin === "https://click.linksynergy.com" &&
              destinationURL.pathname === "/link" && !destinationURL.hash;
            var hasApprovedRakutenTracking = isRakuten &&
              rakutenParameters.length === Object.keys(approvedRakutenTracking).length &&
              Object.keys(approvedRakutenTracking).every(function (key) {
                return destinationURL.searchParams.get(key) === approvedRakutenTracking[key];
              });
            if (!hasApprovedRakutenTracking) {
              fail("This Rakuten link is not the exact approved DealDesk product link.");
              return null;
            }
            return destinationURL;
          }

          var canonical = destinationURL.origin + destinationURL.pathname;
          if (approvedDestinations[canonical] === affiliateNetwork) {
            if (affiliateNetwork === "cj") destinationURL.searchParams.set("sid", clickRef);
            return destinationURL;
          }

          fail("This merchant does not yet have an approved DealDesk commission path.");
          return null;
        }

        function cleanSubID(value) {
          if (!value) return "";
          return value.replace(/[^a-zA-Z0-9]/g, "").slice(0, 32);
        }

      })();
    </script>
  </body>
</html>
