    <path d="M600 414v394" stroke="#0b6883" stroke-width="16" opacity=".42"/>
    <path d="M305 416c91-9 162 10 215 57M305 494c91-9 162 10 215 57M305 572c91-9 162 10 215 57M895 416c-91-9-162 10-215 57M895 494c-91-9-162 10-215 57M895 572c-91-9-162 10-215 57" fill="none" stroke="#1592a7" stroke-width="17" stroke-linecap="round" opacity=".62"/>
