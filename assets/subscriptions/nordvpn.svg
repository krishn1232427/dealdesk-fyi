<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">NordVPN secure browsing illustration</title>
  <desc id="desc">A dark blue mountain landscape with a secure connection shield.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1b4d"/>
      <stop offset="1" stop-color="#3157d5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6d5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#07102f" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="64" fill="url(#sky)"/>
  <circle cx="988" cy="112" r="220" fill="#5d7cf0" opacity=".3"/>
  <circle cx="132" cy="824" r="290" fill="#091433" opacity=".42"/>
  <text x="82" y="128" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">NordVPN</text>
  <text x="84" y="180" fill="#bcd0ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="3">SECURE EVERY CONNECTION</text>
  <path d="M72 722 338 350l147 189 111-138 257 321Z" fill="#5b79e7" opacity=".8"/>
  <path d="m202 722 267-365 267 365Z" fill="#d9e5ff" opacity=".96"/>
  <path d="m469 357-76 104 76-38 72 40Z" fill="#fff"/>
  <g filter="url(#shadow)">
    <path d="M875 250c92 47 160 48 211 48v172c0 132-83 235-211 282-128-47-211-150-211-282V298c51 0 119-1 211-48Z" fill="url(#glow)"/>
    <path d="m793 491 54 55 114-133" fill="none" stroke="#2850ce" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
